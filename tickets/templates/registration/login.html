{% extends 'base.html' %}
{% block content %}
<div class="col-md-5 mx-auto card card-body">
  <h4>Login</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">Login</button>
  </form>
  <p class="mt-3 mb-0">New user? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
